# ============================================================
# .github/workflows/links.yml (ALL-REPOS)
# ============================================================
# Updated: 2026-09-25
#
# REQ: Repositories SHOULD verify links in project documentation and workflow files.
# WHY: This workflow checks links throughout the repository and verifies that
# referenced web pages and resources are still reachable.
# WHY: Broken or outdated links make instructions, references, documentation,
# and project resources harder to use and reproduce.
# OBS: Lychee performs the link checks using the rules in .github/lychee.toml.
# OBS: Runs for pull requests, monthly on schedule, and whenever started manually.
# ALT: Link-checking behavior may be adjusted in .github/lychee.toml when external
# sites require special handling for redirects, rate limits, or automated requests.

name: Check Links

on:
  pull_request: # WHY: Verify changed repository links before merge.
  schedule:
    - cron: "0 6 1 * *" # WHY: Recheck repository links monthly for external link decay.
  workflow_call: # WHY: Allow this workflow to be called by other workflows if needed.
  workflow_dispatch: # WHY: Allow a link check to be started manually at any time.

concurrency:
  # WHY: Avoid duplicate link-checking runs for the same branch or reference.
  group: links-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read # WHY: Required to checkout repository files for link inspection.

jobs:
  lychee:
    name: Link checks
    runs-on: ubuntu-latest # WHY: Stable Linux runner for repository link checking.
    timeout-minutes: 10 # WHY: Prevent unreachable external sites from hanging CI.

    steps:

      # === ASSEMBLE ===

      - name: A1) Checkout repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
        # WHY: Make repository files available so their links can be inspected.

      # === BASIC CHECKS ===

      - name: B1) Check repository links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        # WHY: Find links in repository files and verify that their destinations
        # are reachable according to the rules in .github/lychee.toml.
        with:
          args: >
            --config .github/lychee.toml
            './**/*.md'
            './**/*.html'
            './**/*.yml'
            './**/*.yaml'
