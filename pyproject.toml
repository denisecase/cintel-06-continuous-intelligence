# ============================================================
# pyproject.toml (Python project configuration)
# ============================================================
# Updated: 2026-10-11
#
# REQ: All Python src/ projects SHOULD include pyproject.toml.
# WHAT: Defines project identity, dependencies, and build configuration.
# WHY: Keeps Python project metadata and package requirements together.
# CUSTOM: Update project identity, dependencies, and package paths.

# ============================================================
# === SECTION: PROJECT IDENTITY ===
# ============================================================

[project]
name = "cintel-06-continuous-intelligence"  # Usually matches repository name (use lowercase and dashes).
readme = "README.md"
requires-python = ">=3.14"
version = "0.1.0"

# ============================================================
# === SECTION: PROJECT RUNTIME DEPENDENCIES ===
# ============================================================

dependencies = [
    # REQ: External packages used by the project code.
    "datafun-toolkit", # WHY: Provides professional Python utilities for privacy-preserving logging.
    "marimo", # WHY: Enables reactive web app for app.py.
    "polars[rtcompat]",
]

# ============================================================
# === SECTION: DEVELOPMENT AND DOCUMENTATION DEPENDENCIES ===
# ============================================================
# These packages support developing, testing, and documenting the project.
# They are not required to execute the project code.

[dependency-groups]
# WHY: Development and documentation tools support maintaining, validating,
#      and documenting the project without becoming runtime dependencies.

dev = [
    # REQ.DEV.DEPS: Standard tools for Python development and validation.
    "pytest",     # WHY: Run automated tests.
    "pytest-cov", # WHY: Measure and report test coverage.
    "ruff",       # WHY: Lint and format Python code.
    "ty",         # WHY: Check Python types using static analysis.
]

docs = [
    # REQ.DOCS.DEPS: Standard tools for generating project documentation.
    "mkdocstrings[python]", # WHY: Generate API documentation from Python docstrings.
    "zensical",             # WHY: Build the project documentation website.
]

# ============================================================
# === SECTION: TOOL CONFIGURATION ===
# ============================================================

# === MARIMO REACTIVE NOTEBOOKS ===

[tool.marimo.save]
# WHY: Automatically save changes after a short delay.
autosave = "after_delay"

# WHY: Wait 1000 milliseconds after editing before saving.
autosave_delay = 1000

# WHY: Apply consistent Python formatting when saving.
format_on_save = true

[tool.marimo.package_management]
# WHY: Use uv to manage Python dependencies.
manager = "uv"

[tool.marimo.runtime]
# WHY: Allow Marimo apps to import project modules from src/.
pythonpath = ["./src"]


# === UV (PYTHON ENVIRONMENT AND DEPENDENCY MANAGEMENT) ===

[tool.uv]
# WHY: Install all dependency groups with the canonical uv sync.
default-groups = "all"

# WHY: Give a bit of time to find hijacked releases before installing.
# CUSTOM: Should match `uv run prek update --freeze --cooldown-days 7`
exclude-newer = "7 days"

# WHY: Some releases must be usable immediately.
exclude-newer-package = { datafun-toolkit = false, cintel = false }

# ============================================================
# === SECTION: BUILD SYSTEM ===
# ============================================================
#
# WHAT: Defines how the project's Python package is built and installed.
# WHY: Hatchling enables uv to install the local src/ package so
#      Python modules and tests can import project code consistently.
# REQ: All importable project code MUST live under src/.
# CUSTOM: Match the package directory under src/ exactly.

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[tool.hatch.build.targets.wheel]
# CUSTOM: Must match src/ folders.
packages = ["src/cintel"] # CUSTOM: Adjust as needed to match the actual package directory under src/.
